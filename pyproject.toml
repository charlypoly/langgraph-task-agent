[project]
name = "langgraph-task-agent"
version = "0.1.0"
description = "A tool-calling task agent built with LangGraph."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.8",
    "langchain-openai>=1.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "langgraph-cli[inmem]>=0.4"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent"]
package-dir = {"" = "src"}
